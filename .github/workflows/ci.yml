name: SourceDAO frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Validate runtime config and production build
        working-directory: src
        run: |
          npm ci
          node --test ../scripts/public-config.test.cjs
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime network browser acceptance
        run: |
          python -m pip install playwright==1.59.0
          python -m playwright install --with-deps chromium
          python scripts/test_runtime_browser.py
